name: Build and deploy

on:
  push:
    branches: [main, codex/homepage-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile
      - name: Test the local preview server
        run: pnpm test
      - name: Build and validate all pages
        run: pnpm build
      # Retain the existing gh-pages publishing source and deployment credential.
      # Branch previews and pull requests only build; they never publish.
      - name: Publish static site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GIT_PASS }}
          publish_branch: gh-pages
          publish_dir: ./dist
          user_name: ${{ vars.GIT_USER_NAME }}
          user_email: ${{ vars.GIT_USER_EMAIL }}
